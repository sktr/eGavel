name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @egavel/shared build

      - name: Server tests
        run: pnpm --filter @egavel/server test

      - name: Web tests
        run: pnpm --filter @egavel/web exec vitest run

      - name: Server typecheck
        run: pnpm --filter @egavel/server exec tsc --noEmit

      - name: Web typecheck
        run: pnpm --filter @egavel/web exec tsc --noEmit

      # next build is the authoritative type gate: the web tsconfig does not
      # cover components/, so tsc --noEmit misses type errors there.
      - name: Web build
        run: pnpm --filter @egavel/web build

      - name: Server build
        run: pnpm --filter @egavel/server build
